name: Package 5.7.1 — Disposable Homologation Gate (Scenarios K & L)

on:
  push:
    branches:
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homologation-kl-gate:
    name: Isolated Homologation Gate (Scenarios K & L)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Build Core TypeScript Packages
        shell: pwsh
        run: |
          npm --prefix packages/label-schema run build
          npm --prefix packages/contracts run build
          npm --prefix packages/printer-core run build
          npm --prefix packages/printer-ppla run build
          npm --prefix packages/printer-pplb run build
          npm --prefix apps/backend run build

      - name: Build Windows Agent PE x64 (Rust Release)
        shell: pwsh
        run: |
          cargo build --release --manifest-path apps/agent-core/Cargo.toml
          New-Item -ItemType Directory -Force -Path "bin/agents"
          Copy-Item apps/agent-core/target/release/witiquetas-agent-core.exe bin/agents/witiquetas-agent-windows-x64.exe -Force
          $hash = (Get-FileHash bin/agents/witiquetas-agent-windows-x64.exe -Algorithm SHA256).Hash
          Write-Host "SHA-256 do Binario Windows: $hash"
          echo "AGENT_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Setup and Start PostgreSQL on Windows Runner
        shell: pwsh
        run: |
          # 1. Detectar servico PostgreSQL nativo no runner Windows
          $pgService = Get-Service | Where-Object { $_.Name -like "postgresql*" }
          if (-not $pgService) {
            Write-Host "Instalando PostgreSQL 14 via Chocolatey..."
            choco install postgresql14 --params '/Password:root' -y --no-progress
            $pgService = Get-Service | Where-Object { $_.Name -like "postgresql*" }
          }
          Set-Service -Name $pgService.Name -StartupType Automatic
          Start-Service -Name $pgService.Name
          Write-Host "Servico PostgreSQL iniciado: $($pgService.Name)"

          # 2. Localizar binarios
          $pgBin = $env:PGBIN
          if (-not $pgBin -or -not (Test-Path $pgBin)) {
            $cand = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            if ($cand) { $pgBin = "$($cand.FullName)\bin" }
          }
          Write-Host "PGBIN: $pgBin"

          # 3. Aguardar disponibilidade
          $ready = $false
          for ($i = 1; $i -le 15; $i++) {
            & "$pgBin\pg_isready.exe" -h 127.0.0.1 -p 5432
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw "PostgreSQL nao respondeu na porta 5432!" }

          # 4. Criar banco descartavel exclusivo witiquetas_homolog
          $env:PGPASSWORD = "root"
          & "$pgBin\psql.exe" -h 127.0.0.1 -p 5432 -U postgres -c "ALTER USER postgres WITH PASSWORD 'root';" -ErrorAction SilentlyContinue
          & "$pgBin\createdb.exe" -h 127.0.0.1 -p 5432 -U postgres witiquetas_homolog -ErrorAction SilentlyContinue
          Write-Host "Banco witiquetas_homolog pronto para homologacao descartavel."

      - name: Execute Homologation Gate Suite (Scenarios K & L)
        shell: pwsh
        run: |
          $env:DATABASE_URL = "postgresql://postgres:root@127.0.0.1:5432/witiquetas_homolog"
          $env:NODE_ENV = "test"
          $env:AGENT_EXE_PATH = "bin/agents/witiquetas-agent-windows-x64.exe"
          node --loader ./tests/ts-loader.js --test tests/package571HomologationGateKL.test.ts 2>&1 | Tee-Object -FilePath homolog-output.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha na suíte de homologação K/L!"
            exit 1
          }

      - name: Publish Homologation Summary to Step Summary
        if: always()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Package 5.7.1 — Disposable Homologation Gate (Scenarios K & L)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Runner:** Windows Server (Isolated GitHub Actions VM)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Target Executable SHA-256:** \`$env:AGENT_SHA256\`"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Database:** PostgreSQL on 127.0.0.1 (Ephemeral)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          if (Test-Path homolog-output.txt) {
            Get-Content homolog-output.txt | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'

      - name: Upload Homologation Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologation-kl-output
          path: homolog-output.txt
          if-no-files-found: ignore
