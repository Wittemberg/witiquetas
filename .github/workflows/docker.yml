name: Build and Deploy Witiquetas

on:
  push:
    branches:
      - main
      - 'validation/**'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Autorizar promocao para :stable e deploy em producao (true obrigatorio)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-agent-windows:
    name: Build Real Windows Agent (x64 PE)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Test Agent Core
        run: cargo test --manifest-path apps/agent-core/Cargo.toml

      - name: Build Agent Core Release
        run: cargo build --release --manifest-path apps/agent-core/Cargo.toml

      - name: Validate Windows PE Executable
        shell: pwsh
        run: |
          $exePath = "apps/agent-core/target/release/witiquetas-agent-core.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executavel $exePath nao foi encontrado!"
            exit 1
          }
          $item = Get-Item $exePath
          Write-Host "Tamanho do EXE: $($item.Length) bytes"
          if ($item.Length -lt 1000000) {
            Write-Error "Tamanho do executavel muito pequeno ($($item.Length) bytes)!"
            exit 1
          }
          
          # Teste de execucao real no runner Windows
          Write-Host "Executando --version..."
          & $exePath --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha ao executar --version! ExitCode: $LASTEXITCODE"
            exit 1
          }

          Write-Host "Executando --help..."
          & $exePath --help
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha ao executar --help! ExitCode: $LASTEXITCODE"
            exit 1
          }

          # Calcular e exibir SHA-256
          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash
          Write-Host "SHA-256 do Binario Windows: $hash"

          # Copiar para nome padronizado de distribuicao
          New-Item -ItemType Directory -Force -Path "bin/agents"
          Copy-Item $exePath "bin/agents/witiquetas-agent-windows-x64.exe" -Force

      - name: Upload Windows Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows-x64
          path: bin/agents/witiquetas-agent-windows-x64.exe
          if-no-files-found: error

  postgres-integration-gate:
    name: PostgreSQL Integration Gate — Package 5.7.1
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: witiquetas_test
          POSTGRES_USER: witiquetas_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for PostgreSQL Gate
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core TypeScript Packages for PostgreSQL Gate
        run: |
          npm --prefix packages/label-schema run build
          npm --prefix packages/contracts run build
          npm --prefix packages/printer-core run build
          npm --prefix packages/printer-ppla run build
          npm --prefix packages/printer-pplb run build

      - name: Execute Dedicated PostgreSQL 14 Integration Test Suite
        env:
          DATABASE_URL: postgresql://witiquetas_test:ci_test_password@127.0.0.1:5432/witiquetas_test
          NODE_ENV: test
        run: |
          set -o pipefail
          node --loader ./tests/ts-loader.js --test tests/package571PostgresRealIntegration.test.ts 2>&1 | tee test-output.txt

      - name: Surface Test Output on Failure
        if: failure()
        run: |
          cat test-output.txt
          node -e "const fs = require('fs'); if (fs.existsSync('test-output.txt')) { const txt = fs.readFileSync('test-output.txt', 'utf8').replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'); console.log('::error title=PostgreSQL Gate Output::' + txt); }"
          echo "### PostgreSQL Integration Gate Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-output
          path: test-output.txt
          if-no-files-found: ignore

  build-and-test-candidates:
    name: Build & Validate Candidate Images
    needs: [build-agent-windows, postgres-integration-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Agent Artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-windows-x64
          path: apps/backend/bin/agents/

      - name: Verify Downloaded Windows Agent
        run: |
          mkdir -p apps/backend/bin/agents
          ls -la apps/backend/bin/agents/
          test -f apps/backend/bin/agents/witiquetas-agent-windows-x64.exe
          echo "Windows Agent pronto para inclusão na imagem Docker do Backend."

      # =========================================================================
      # CI QUALITY GATE — TypeScript & Package Tests (P0-3 RESOLVED)
      # =========================================================================
      - name: Set up Node.js for Quality Gate
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core TypeScript Packages
        run: |
          npm --prefix packages/label-schema run build
          npm --prefix packages/contracts run build

      - name: Run TypeScript Automated Tests & Quality Gate
        run: |
          node --loader ./tests/ts-loader.js --test tests/package5701AgentPairingHotfix.test.ts tests/platformDeveloperSessionStability.test.ts tests/package57PrintersAndAgentsGovernance.test.ts tests/package56IntegrationFoundation.test.ts tests/package561IntegrationUxAndEdit.test.ts tests/p0HotfixDuplicateAndPrintersIsolation.test.ts tests/authSessionRbac.test.ts tests/adminRbacFoundation.test.ts tests/adminManagement.test.ts tests/webPrintFlow.test.ts tests/devControlInvariants.test.ts tests/dccBomRobustness.test.ts tests/package572SaveIndustrialTemplateRegression.test.ts tests/package571PersistentPrintQueue.test.ts tests/manualDeploySafetyWorkflow.test.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate Build Metadata Variables
        id: vars
        run: |
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build & Push Backend Candidate Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            SHORT_SHA=${{ steps.vars.outputs.short_sha }}
            BUILT_AT=${{ steps.vars.outputs.built_at }}
          tags: |
            ghcr.io/wittemberg/witiquetas-backend:candidate-${{ github.sha }}

      - name: Build & Push Frontend Candidate Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            SHORT_SHA=${{ steps.vars.outputs.short_sha }}
            BUILT_AT=${{ steps.vars.outputs.built_at }}
            VITE_ENABLE_DEV_CONTROL_CENTER=true
          tags: |
            ghcr.io/wittemberg/witiquetas-frontend:candidate-${{ github.sha }}

      - name: Validate Backend Container Health & Agent Download Endpoint
        run: |
          set -e
          
          cleanup() {
            echo "==> Limpando recursos efêmeros do CI..."
            docker stop test-backend test-postgres >/dev/null 2>&1 || true
            docker rm -f test-backend test-postgres >/dev/null 2>&1 || true
            docker network rm witiquetas-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "==> Criando network temporária witiquetas-ci..."
          docker network create witiquetas-ci

          echo "==> Iniciando PostgreSQL 16 Alpine efêmero..."
          docker run -d \
            --name test-postgres \
            --network witiquetas-ci \
            -e POSTGRES_DB=witiquetas \
            -e POSTGRES_USER=witiquetas \
            -e POSTGRES_PASSWORD=ci_test_password \
            postgres:16-alpine

          echo "==> Aguardando PostgreSQL ficar pronto (pg_isready)..."
          for i in $(seq 1 30); do
            if docker exec test-postgres pg_isready -U witiquetas -d witiquetas >/dev/null 2>&1; then
              echo "PostgreSQL pronto após $i tentativas."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Erro: Timeout aguardando PostgreSQL ficar disponível."
              docker logs test-postgres
              exit 1
            fi
            sleep 1
          done

          echo "==> Iniciando backend container com DATABASE_URL e NODE_ENV=production..."
          docker run -d \
            --name test-backend \
            --network witiquetas-ci \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e ENABLE_DEV_CONTROL_CENTER=true \
            -e ADMIN_API_KEY=ci_test_key \
            -e ADMIN_COMPANY_ID=comp-ci \
            -e DATABASE_URL=postgresql://witiquetas:ci_test_password@test-postgres:5432/witiquetas \
            ghcr.io/wittemberg/witiquetas-backend:candidate-${{ github.sha }}

          echo "==> Aguardando backend responder em /api/health..."
          BACKEND_HEALTHY=false
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend saudável (HTTP 200 em /api/health) após $i tentativas."
              BACKEND_HEALTHY=true
              break
            fi
            sleep 1
          done

          if [ "$BACKEND_HEALTHY" != "true" ]; then
            echo "Erro: Backend não ficou saudável a tempo!"
            docker logs test-backend || true
            exit 1
          fi

          echo "==> Testando download do agent Windows x64 (GET /api/agents/download/windows-x64)..."
          DOWNLOAD_STATUS=$(curl -s -w "%{http_code}" http://localhost:3000/api/agents/download/windows-x64 -o downloaded-agent.exe)
          if [ "$DOWNLOAD_STATUS" != "200" ]; then
            echo "Erro: Endpoint de download retornou HTTP $DOWNLOAD_STATUS"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s downloaded-agent.exe 2>/dev/null || stat -f%z downloaded-agent.exe)
          if [ "$FILE_SIZE" -le 1000000 ]; then
            echo "Erro: Arquivo baixado é menor que 1 MB ($FILE_SIZE bytes)!"
            exit 1
          fi

          echo "==> Validando endpoint /api/version no backend CI..."
          CI_BACKEND_VERSION=$(curl -s http://localhost:3000/api/version)
          echo "CI Backend Version: $CI_BACKEND_VERSION"
          CI_BACKEND_COMMIT=$(echo "$CI_BACKEND_VERSION" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || echo "")
          if [ "$CI_BACKEND_COMMIT" != "${{ github.sha }}" ]; then
            echo "Erro: /api/version retornou commit '$CI_BACKEND_COMMIT', esperado '${{ github.sha }}'!"
            exit 1
          fi
          echo "CI Backend /api/version validado com sucesso (SHA=${{ github.sha }})."

          echo "Smoke test de container concluído com sucesso."

  validate-predeploy-backup:
    name: Pre-Deploy Backup & Restore Verification Gate
    needs: [build-and-test-candidates]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Deployer SSH Configuration
        id: check_deployer
        run: |
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST || 'witiquetas.wrtec.com.br' }}"
          if [ -z "$DEPLOY_HOST" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "❌ ERRO: Secrets DEPLOY_HOST ou DEPLOY_SSH_KEY não configurados no GitHub Actions!"
            echo "Execute uma única vez o script scripts/deploy/setup-authorized-executor.sh no host de produção."
            exit 1
          fi
          if [ -z "${{ secrets.MINIO_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.MINIO_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ ERRO: Secrets MINIO_ACCESS_KEY_ID ou MINIO_SECRET_ACCESS_KEY não configurados no GitHub Actions!"
            exit 1
          fi
          echo "Deployer e MinIO secrets configurados e validados."

      - name: Setup SSH Key & Known Hosts
        run: |
          DEPLOY_PORT="${{ secrets.DEPLOY_PORT || 5822 }}"
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST || 'witiquetas.wrtec.com.br' }}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Execute Verified Backup & Ephemeral Restore Gate via Authorized Executor
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.MINIO_ENDPOINT || 'https://s3.wrtec.com.br' }}
          S3_BUCKET: ${{ vars.MINIO_BUCKET || 's3://witiquetas-bkp/pre-deploy' }}
          S3_REGION: ${{ vars.MINIO_REGION || 'eu-south' }}
          TARGET_DB: ${{ vars.PRODUCTION_DB || 'witiquetas ' }}
          TARGET_COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 5822 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'witiquetas.wrtec.com.br' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'witiquetas-deployer' }}
        run: |
          set -e
          echo "🚀 Acionando backup auditado e validação de restauração no host autorizado via SSH (porta $DEPLOY_PORT)..."
          
          # Passar parâmetros estritamente via stdin seguro: zero credenciais em ps aux, argumentos ou disco
          cat <<EOF | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -T "${DEPLOY_USER}@${DEPLOY_HOST}" > execution_output.txt
AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
S3_ENDPOINT=$S3_ENDPOINT
S3_BUCKET=$S3_BUCKET
S3_REGION=$S3_REGION
TARGET_DB=$TARGET_DB
TARGET_COMMIT_SHA=$TARGET_COMMIT_SHA
WORKFLOW_RUN_ID=$WORKFLOW_RUN_ID
EOF

          # Extrair a evidência estruturada da saída capturada
          sed -n '/<<<WITIQUETAS_BACKUP_EVIDENCE_JSON>>>/,/<<<END_WITIQUETAS_BACKUP_EVIDENCE_JSON>>>/p' execution_output.txt |             grep -v '<<<.*WITIQUETAS_BACKUP_EVIDENCE_JSON>>>' > "./backup_evidence_${{ github.sha }}.json"

      - name: Validate Integrity & Authenticity of Backup Evidence Artifact
        run: |
          set -e
          EVIDENCE_FILE="./backup_evidence_${{ github.sha }}.json"
          if [ ! -f "$EVIDENCE_FILE" ] || [ ! -s "$EVIDENCE_FILE" ]; then
            echo "❌ ERRO: Arquivo de evidência $EVIDENCE_FILE não foi gerado ou está vazio!"
            cat execution_output.txt || true
            exit 1
          fi

          echo "📋 Validando conteúdo e autenticidade da evidência..."
          cat "$EVIDENCE_FILE"

          STATUS=$(grep -o '"status": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)
          COMMIT=$(grep -o '"targetCommitSha": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)
          RUN_ID=$(grep -o '"workflowRunId": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)
          DUMP_NAME=$(grep -o '"dumpFilename": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)
          DUMP_SHA=$(grep -o '"dumpSha256": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)
          SIGNATURE=$(grep -o '"integritySignature": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)

          if [ "$STATUS" != "GO" ]; then
            echo "❌ ERRO: Status da evidência retornado é '$STATUS' (esperado: 'GO')!"
            exit 1
          fi

          if [ "$COMMIT" != "${{ github.sha }}" ]; then
            echo "❌ ERRO: Commit na evidência ('$COMMIT') difere do commit atual ('${{ github.sha }}')!"
            exit 1
          fi

          if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
            echo "❌ ERRO: Run ID na evidência ('$RUN_ID') difere do Run ID atual ('${{ github.run_id }}')!"
            exit 1
          fi

          # Validação matemática da assinatura de integridade
          EXPECTED_SIGNATURE=$(printf '%s|%s|%s|%s|GO' "${{ github.sha }}" "${{ github.run_id }}" "$DUMP_SHA" "$DUMP_NAME" | sha256sum | awk '{print $1}')
          if [ "$SIGNATURE" != "$EXPECTED_SIGNATURE" ]; then
            echo "❌ ERRO FATAL: Assinatura de integridade da evidência inválida!"
            echo "  Assinatura recebida: $SIGNATURE"
            echo "  Assinatura esperada: $EXPECTED_SIGNATURE"
            exit 1
          fi

          echo "✅ Evidência validada com autenticidade estrita: Status=GO, Commit=${{ github.sha }}, Run=${{ github.run_id }}, Assinatura OK."

      - name: Publish Gate Summary to GitHub Step Summary
        run: |
          EVIDENCE_FILE="./backup_evidence_${{ github.sha }}.json"
          DUMP_NAME=$(grep -o '"dumpFilename": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4 || echo "N/A")
          DUMP_SHA=$(grep -o '"dumpSha256": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4 || echo "N/A")
          S3_URI=$(grep -o '"s3Uri": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4 || echo "N/A")
          TABLES=$(grep -o '"tablesAudited": *[0-9]*' "$EVIDENCE_FILE" | awk '{print $2}' || echo "N/A")

          echo "### 🛡️ Pre-Deploy Backup & Restore Gate — APROVADO (GO)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica / Verificação | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Resultado do Gate** | **APROVADO (GO)** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit Validado** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Arquivo de Dump** | \`$DUMP_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA-256 do Dump** | \`$DUMP_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Destino MinIO/S3** | \`$S3_URI\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tabelas Auditadas** | \`$TABLES\` tabelas com integridade referencial 100% OK |" >> $GITHUB_STEP_SUMMARY
          echo "| **Restauração de Teste** | \`postgres:14-alpine\` efêmero isolado com exit code 0 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ **Próximo Passo:** A publicação agora aguarda **aprovação humana** no ambiente **Production**." >> $GITHUB_STEP_SUMMARY

      - name: Upload Backup Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-evidence-${{ github.sha }}
          path: backup_evidence_${{ github.sha }}.json
          if-no-files-found: error

  deploy-production:
    name: Promote & Deploy to Production
    needs: [build-and-test-candidates, validate-predeploy-backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download Backup Evidence Artifact
        uses: actions/download-artifact@v4
        with:
          name: backup-evidence-${{ github.sha }}
          path: ./

      - name: Strict Pre-Deploy Evidence Verification (Replay Prevention & Authenticity)
        run: |
          set -e
          EVIDENCE_FILE="./backup_evidence_${{ github.sha }}.json"
          if [ ! -f "$EVIDENCE_FILE" ]; then
            echo "❌ ERRO FATAL: Arquivo de evidência de backup $EVIDENCE_FILE não encontrado."
            echo "O deploy para produção NÃO pode prosseguir sem backup prévio validado."
            exit 1
          fi

          STATUS=$(grep -o '"status": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)
          COMMIT=$(grep -o '"targetCommitSha": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)
          RUN_ID=$(grep -o '"workflowRunId": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)
          DUMP_NAME=$(grep -o '"dumpFilename": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)
          DUMP_SHA=$(grep -o '"dumpSha256": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)
          SIGNATURE=$(grep -o '"integritySignature": *"[^"]*"' "$EVIDENCE_FILE" | cut -d'"' -f4)

          if [ "$STATUS" != "GO" ]; then
            echo "❌ ERRO FATAL: Status do backup é '$STATUS'. Deploy bloqueado (NO-GO)!"
            exit 1
          fi

          if [ "$COMMIT" != "${{ github.sha }}" ]; then
            echo "❌ ERRO FATAL: Tentativa de reaproveitamento indevido de evidência antiga!"
            echo "Evidência possui commit '$COMMIT', mas este deploy exige '${{ github.sha }}'."
            exit 1
          fi

          if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
            echo "❌ ERRO FATAL: Evidência gerada em run '$RUN_ID' difere deste run '${{ github.run_id }}'!"
            exit 1
          fi

          # Validação matemática da assinatura de integridade
          EXPECTED_SIGNATURE=$(printf '%s|%s|%s|%s|GO' "${{ github.sha }}" "${{ github.run_id }}" "$DUMP_SHA" "$DUMP_NAME" | sha256sum | awk '{print $1}')
          if [ "$SIGNATURE" != "$EXPECTED_SIGNATURE" ]; then
            echo "❌ ERRO FATAL: Assinatura de integridade da evidência de backup inválida ou forjada!"
            exit 1
          fi

          echo "✅ Validação de Evidência Autêntica: Backup GO confirmado para o commit ${{ github.sha }} (Run ${{ github.run_id }})."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Record Previous Stable Digests Before Promotion
        id: pre_stable
        run: |
          PREV_FRONT_DIGEST=$(docker buildx imagetools inspect ghcr.io/wittemberg/witiquetas-frontend:stable --format '{{.Manifest.Digest}}' 2>/dev/null || echo "")
          PREV_BACK_DIGEST=$(docker buildx imagetools inspect ghcr.io/wittemberg/witiquetas-backend:stable --format '{{.Manifest.Digest}}' 2>/dev/null || echo "")
          echo "prev_front_digest=$PREV_FRONT_DIGEST" >> $GITHUB_OUTPUT
          echo "prev_back_digest=$PREV_BACK_DIGEST" >> $GITHUB_OUTPUT
          echo "Previous Frontend Stable Digest: $PREV_FRONT_DIGEST"
          echo "Previous Backend Stable Digest: $PREV_BACK_DIGEST"

      - name: Promote Candidate Images to Production & Stable (Zero-Rebuild Immutable Promotion)
        run: |
          echo "Promovendo candidato sem reconstrução..."
          docker buildx imagetools create -t ghcr.io/wittemberg/witiquetas-frontend:production-${{ github.sha }} ghcr.io/wittemberg/witiquetas-frontend:candidate-${{ github.sha }}
          docker buildx imagetools create -t ghcr.io/wittemberg/witiquetas-frontend:stable ghcr.io/wittemberg/witiquetas-frontend:candidate-${{ github.sha }}
          docker buildx imagetools create -t ghcr.io/wittemberg/witiquetas-frontend:latest ghcr.io/wittemberg/witiquetas-frontend:candidate-${{ github.sha }}

          docker buildx imagetools create -t ghcr.io/wittemberg/witiquetas-backend:production-${{ github.sha }} ghcr.io/wittemberg/witiquetas-backend:candidate-${{ github.sha }}
          docker buildx imagetools create -t ghcr.io/wittemberg/witiquetas-backend:stable ghcr.io/wittemberg/witiquetas-backend:candidate-${{ github.sha }}
          docker buildx imagetools create -t ghcr.io/wittemberg/witiquetas-backend:latest ghcr.io/wittemberg/witiquetas-backend:candidate-${{ github.sha }}

          echo "Promoção imutável concluída com sucesso."

      - name: Trigger Portainer Redeploy Webhook
        run: |
          if [ -z "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            echo "❌ ERRO FATAL: Secret PORTAINER_WEBHOOK_URL não configurado! Deploy bloqueado."
            exit 1
          fi
          echo "Acionando webhook de redeploy do Portainer..."
          WEBHOOK_START_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "webhook_timestamp=$WEBHOOK_START_TIME" >> $GITHUB_ENV
          curl --fail --show-error --silent -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
          echo "Webhook acionado com sucesso em $WEBHOOK_START_TIME."

      - name: Verify Live Production Version & Strict Convergence Gate
        run: |
          echo "Validando implantação ao vivo em https://witiquetas.wrtec.com.br/version.json e /api/version..."
          DEPLOY_SUCCESS=false
          EXPECTED_SHA="${{ github.sha }}"
          START_SECS=$(date +%s)
          FIRST_SUCCESS_TIME=""

          for i in $(seq 1 30); do
            VERSION_RESPONSE=$(curl -s --max-time 5 https://witiquetas.wrtec.com.br/version.json || echo "")
            LIVE_FRONT_COMMIT=$(echo "$VERSION_RESPONSE" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || echo "")
            if [ -z "$LIVE_FRONT_COMMIT" ]; then
              LIVE_FRONT_COMMIT=$(echo "$VERSION_RESPONSE" | grep -o '"candidateSha":"[^"]*"' | cut -d'"' -f4 || echo "")
            fi

            BACKEND_RESPONSE=$(curl -s --max-time 5 https://witiquetas.wrtec.com.br/api/version || echo "")
            LIVE_BACK_COMMIT=$(echo "$BACKEND_RESPONSE" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || echo "")
            if [ -z "$LIVE_BACK_COMMIT" ]; then
              LIVE_BACK_COMMIT=$(echo "$BACKEND_RESPONSE" | grep -o '"candidateSha":"[^"]*"' | cut -d'"' -f4 || echo "")
            fi

            HEALTH_RESPONSE=$(curl -s --max-time 5 https://witiquetas.wrtec.com.br/api/health || echo "")
            HEALTH_STATUS=$(echo "$HEALTH_RESPONSE" | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || echo "")

            NOW_SECS=$(date +%s)
            ELAPSED_SECS=$((NOW_SECS - START_SECS))

            if [ "$LIVE_FRONT_COMMIT" = "$EXPECTED_SHA" ] && [ "$LIVE_BACK_COMMIT" = "$EXPECTED_SHA" ]; then
              FIRST_SUCCESS_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
              echo "Tentativa $i/30 ($ELAPSED_SECS s): SHA ao vivo retornado é o esperado no Frontend ('$LIVE_FRONT_COMMIT') e Backend ('$LIVE_BACK_COMMIT'). Saúde: '$HEALTH_STATUS'."
              echo "========================================================"
              echo "RELATÓRIO DE MÉTRICAS DO DEPLOY PORTAINER (GO):"
              echo "  Timestamp Webhook:            ${webhook_timestamp:-Desconhecido}"
              echo "  Timestamp Primeira Resposta:  $FIRST_SUCCESS_TIME"
              echo "  Tempo Total de Convergência:  $ELAPSED_SECS segundos"
              echo "  Saúde da API (/api/health):    $HEALTH_STATUS"
              echo "========================================================"
              DEPLOY_SUCCESS=true
              break
            elif [ -z "$LIVE_FRONT_COMMIT" ] || [ -z "$LIVE_BACK_COMMIT" ]; then
              echo "Tentativa $i/30 ($ELAPSED_SECS s): Um ou mais endpoints indisponíveis (troca de container Portainer em andamento). Aguardando..."
            else
              echo "Tentativa $i/30 ($ELAPSED_SECS s): Frontend SHA é '$LIVE_FRONT_COMMIT', Backend SHA é '$LIVE_BACK_COMMIT' (aguardando convergência para '$EXPECTED_SHA')..."
            fi

            sleep 5
          done

          if [ "$DEPLOY_SUCCESS" != "true" ]; then
            echo "❌ ERRO CRÍTICO DE CONVERGÊNCIA (NO-GO):"
            echo "Os containers em produção não convergiram para o commit $EXPECTED_SHA dentro da janela total de 150 segundos (150s)."
            echo "Deploy marcado compulsoriamente como FALHA para impedir falso positivo."
            echo "Verifique o status da stack no Portainer / Docker Swarm."
            exit 1
          fi

          echo "### 🚀 Produção Atualizada com Sucesso (GO)" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Detalhe |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit Implantado** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | \`ghcr.io/wittemberg/witiquetas-frontend:stable\` (\`${{ steps.vars.outputs.short_sha }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | \`ghcr.io/wittemberg/witiquetas-backend:stable\` (\`${{ steps.vars.outputs.short_sha }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tempo de Convergência** | \`${ELAPSED_SECS}s\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status de Saúde** | \`HEALTHY (200 OK)\` |" >> $GITHUB_STEP_SUMMARY
