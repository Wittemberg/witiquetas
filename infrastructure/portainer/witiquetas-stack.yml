version: "3.8"

services:
  frontend:
    image: ghcr.io/wittemberg/witiquetas-frontend:latest
    networks:
      - interna
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.witiquetas.rule=Host(`witiquetas.wrtec.com.br`)"
        - "traefik.http.routers.witiquetas.entrypoints=websecure"
        - "traefik.http.routers.witiquetas.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.witiquetas.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 4

  backend:
    image: ghcr.io/wittemberg/witiquetas-backend:latest
    networks:
      - interna
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=America/Sao_Paulo
      - DATABASE_URL=${DATABASE_URL:-postgresql://witiquetas_app:witiquetas_pass@postgres:5432/witiquetas}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_REGION=${S3_REGION:-eu-south}
      - S3_BUCKET=${S3_BUCKET:-witiquetas}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_FORCE_PATH_STYLE=true
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.witiquetas-api.rule=Host(`witiquetas.wrtec.com.br`) && PathPrefix(`/api`)"
        - "traefik.http.routers.witiquetas-api.entrypoints=websecure"
        - "traefik.http.routers.witiquetas-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.witiquetas-api.priority=100"
        - "traefik.http.services.witiquetas-api.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 4

networks:
  interna:
    external: true
    name: interna
